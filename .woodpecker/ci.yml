# ggaze CI — Woodpecker (codeberg-native).
#
# Three lanes (see docs/IMPLEMENTATION.md Phase 0):
#   minimal  all optional backends disabled (jpeg included: only then is
#            GGAZE_HAVE_ANY_BACKEND 0 and the loader's #else branches
#            compiled at all); plain GdkPixbuf viewer.
#   gegl     gegl=enabled (+ jxl/avif/heif/jpeg auto) — keeps the optional
#            path from bit-rotting. libjpeg-turbo-devel is installed so
#            jpeg=auto finds it: colour-managed JPEGs on the enhance path
#            need the libjpeg check pass (loader/intact.c), without which
#            every JPEG keeps the loader path (the tests cover both).
#            lcms2-devel: the enhancer opens CMYK profiles with LCMS before
#            babl does (babl-devel pulls it in; named for clarity). The
#            lane also builds gegl=enabled jpeg=disabled a second time and
#            runs its unit suite only: that build is the one where every
#            JPEG must keep the loader path (no libjpeg to check it with),
#            which no other lane compiles; its integration suites add
#            nothing the unit ones do not pin for that branch.
#   asan     the same minimal build (jpeg disabled too) under
#            AddressSanitizer + UBSan (also drives the per-feature
#            leak-check tasks).
#
# The coverage gate runs in the minimal lane and is "warn" until M10, after
# which it is flipped to fail (see docs/IMPLEMENTATION.md Cross-cutting).

matrix:
  include:
    - LANE: minimal
      MESON_OPTS: "-Dgegl=disabled -Djxl=disabled -Davif=disabled -Dheif=disabled -Djpeg=disabled"
      RUN_COVERAGE: "yes"
      ENV: ""
    - LANE: gegl
      MESON_OPTS: "-Dgegl=enabled"
      RUN_COVERAGE: "no"
      ENV: ""
    - LANE: asan
      MESON_OPTS: "-Dgegl=disabled -Djxl=disabled -Davif=disabled -Dheif=disabled -Djpeg=disabled -Db_sanitize=address,undefined"
      RUN_COVERAGE: "no"
      ENV: "G_DEBUG=gc-friendly ASAN_OPTIONS=detect_leaks=1:abort_on_error=1"

when:
  - event: [push, pull_request, manual]

steps:
  build-and-test:
    image: fedora:40
    environment: ${ENV}
    commands:
      - dnf install -y --setopt=install_weak_deps=False
          meson ninja-build gcc clang clang-format git
          pkgconf-pkg-config xorg-x11-server-Xvfb
          gtk4-devel glib2-devel libadwaita-devel
          libasan libubsan
      - |
        if [ "$LANE" = "gegl" ]; then
          dnf install -y --setopt=install_weak_deps=False gegl-devel babl-devel \
            lcms2-devel libjpeg-turbo-devel
        fi
      - meson setup build $MESON_OPTS
      - ninja -C build
      - clang-format --dry-run --Werror $(git ls-files '*.c' '*.h')
      - |
        if [ "$RUN_COVERAGE" = "yes" ]; then
          # lcov/genhtml not installed in Phase 0 (gate warns until M10);
          # add lcov + (perl-Dot-Graph or genhtml) here when M10 flips the
          # coverage gate to fail.
          meson setup -Db_coverage=true build-cov $MESON_OPTS
          ninja -C build-cov
          meson test -C build-cov
          ninja -C build-cov coverage || echo "coverage: lcov/genhtml not installed (warn)"
        fi
      - meson test -C build --suite unit
      - xvfb-run -a meson test -C build --suite integration
      - |
        if [ "$LANE" = "gegl" ]; then
          meson setup build-nojpeg $MESON_OPTS -Djpeg=disabled
          ninja -C build-nojpeg
          meson test -C build-nojpeg --suite unit
        fi