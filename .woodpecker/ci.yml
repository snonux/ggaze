# ggaze CI — Woodpecker (codeberg-native).
#
# Three lanes (see docs/IMPLEMENTATION.md Phase 0):
#   minimal  all optional backends disabled (jpeg included: only then is
#            GGAZE_HAVE_ANY_BACKEND 0 and the loader's #else branches
#            compiled at all); plain GdkPixbuf viewer.
#   gegl     gegl=enabled (+ jxl/avif/heif auto) — keeps the optional path
#            from bit-rotting.
#   asan     the same minimal build (jpeg disabled too) under
#            AddressSanitizer + UBSan (also drives the per-feature
#            leak-check tasks).
#
# The coverage gate runs in the minimal lane and is "warn" until M10, after
# which it is flipped to fail (see docs/IMPLEMENTATION.md Cross-cutting).

matrix:
  include:
    - LANE: minimal
      MESON_OPTS: "-Dgegl=disabled -Djxl=disabled -Davif=disabled -Dheif=disabled -Djpeg=disabled"
      RUN_COVERAGE: "yes"
      G_DEBUG: ""
      ASAN_OPTIONS: ""
    - LANE: gegl
      MESON_OPTS: "-Dgegl=enabled"
      RUN_COVERAGE: "no"
      G_DEBUG: ""
      ASAN_OPTIONS: ""
    - LANE: asan
      MESON_OPTS: "-Dgegl=disabled -Djxl=disabled -Davif=disabled -Dheif=disabled -Djpeg=disabled -Db_sanitize=address,undefined"
      RUN_COVERAGE: "no"
      G_DEBUG: "gc-friendly"
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"

when:
  - event: [push, pull_request, manual]

steps:
  build-and-test:
    image: fedora:40
    # One map entry per variable: Woodpecker substitutes matrix values as
    # text, so a single "VAR=value VAR=value" matrix string would make
    # `environment` a string, not the map it must be. Empty outside asan.
    environment:
      G_DEBUG: "${G_DEBUG}"
      ASAN_OPTIONS: "${ASAN_OPTIONS}"
    commands:
      # fedora:40 package names (verified in a fedora:40 container, gg2):
      # clang-format ships in clang-tools-extra; libexif-devel is the
      # mandatory EXIF dependency (meson.build); desktop-file-utils provides
      # update-desktop-database for data/meson.build's gnome.post_install();
      # GEGL 0.4 is gegl04-devel (there is no gegl-devel on fedora:40).
      - dnf install -y --setopt=install_weak_deps=False
          meson ninja-build gcc clang clang-tools-extra git
          pkgconf-pkg-config xorg-x11-server-Xvfb
          gtk4-devel glib2-devel libadwaita-devel libexif-devel
          desktop-file-utils libasan libubsan
      - |
        if [ "$LANE" = "gegl" ]; then
          dnf install -y --setopt=install_weak_deps=False gegl04-devel babl-devel
        fi
      - meson setup build $MESON_OPTS
      - ninja -C build
      - clang-format --dry-run --Werror $(git ls-files '*.c' '*.h')
      - |
        if [ "$RUN_COVERAGE" = "yes" ]; then
          # lcov/genhtml not installed in Phase 0 (gate warns until M10);
          # add lcov + (perl-Dot-Graph or genhtml) here when M10 flips the
          # coverage gate to fail.
          meson setup -Db_coverage=true build-cov $MESON_OPTS
          ninja -C build-cov
          meson test -C build-cov
          ninja -C build-cov coverage || echo "coverage: lcov/genhtml not installed (warn)"
        fi
      - meson test -C build --suite unit
      - xvfb-run -a meson test -C build --suite integration